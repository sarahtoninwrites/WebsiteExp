<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Walker</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            cursor: pointer;
        }
        .instructions {
            text-align: center;
            color: #555;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="instructions">Drag the shapes to block the character's path.</div>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
/**
 * Module: Utilities
 * Simple AABB (Axis-Aligned Bounding Box) collision detection.
 */
function checkCollision(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.w &&
        rect1.x + rect1.w > rect2.x &&
        rect1.y < rect2.y + rect2.h &&
        rect1.y + rect1.h > rect2.y
    );
}

/**
 * Module: Obstacle
 * Represents the movable blocks.
 */
class Obstacle {
    constructor(x, y, w, h, imageSrc, options = {}) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.image = new Image();
        this.image.src = imageSrc;

        // For shapes like trapeziums, defines the percentage of width for the slope
        this.slopePercent = options.slopePercent || 0.25;
        this.isDragging = false;
        this.dragOffsetX = 0;
        this.dragOffsetY = 0;
    }

    draw(ctx) {
        ctx.drawImage(this.image, this.x, this.y, this.w, this.h);
        
        if (this.isDragging) {
            ctx.strokeStyle = '#4a90e2';
            ctx.lineWidth = 2;
            ctx.strokeRect(this.x, this.y, this.w, this.h);
        }
    }

    // Check if a point (mouse click) is inside this obstacle
    contains(mx, my) {
        return (mx >= this.x && mx <= this.x + this.w && my >= this.y && my <= this.y + this.h);
    }

    getType() {
        if (this.image.src.includes('triangle')) return 'triangle';
        if (this.image.src.includes('trapezium')) return 'trapezium';
        return 'square';
    }

    getSurfaceY(worldX) {
        const type = this.getType();
        const localX = worldX - this.x;

        if (localX < 0 || localX > this.w) return null;

        if (type === 'square') {
            return this.y;
        } else if (type === 'triangle') {
            const mid = this.w / 2;
            if (localX < mid) {
                // Going up
                return (this.y + this.h) - (this.h * (localX / mid));
            } else {
                // Going down
                return this.y + (this.h * ((localX - mid) / mid));
            }
        } else if (type === 'trapezium') {
            const slopeW = this.w * this.slopePercent; 
            if (localX < slopeW) {
                return (this.y + this.h) - (this.h * (localX / slopeW));
            } else if (localX > this.w - slopeW) {
                return (this.y + this.h) - (this.h * ((this.w - localX) / slopeW));
            } else {
                return this.y;
            }
        }
        return this.y;
    }
}

/**
 * Module: Platform
 * Represents a static, non-movable part of the map.
 */
class Platform {
    constructor(x, y, w, h, color = '#FFFFFF') {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.color = color;
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }
}

/**
 * Module: Character
 * Represents the walking entity.
 */
class Character {
    constructor(canvasWidth, canvasHeight) {
        this.w = 60;
        this.h = 60;
        this.x = 0; // Start at left
        this.y = canvasHeight / 2 - this.h / 2; // Start at middle left
        this.baseSpeed = 2;
        this.canvasWidth = canvasWidth;
        this.canvasHeight = canvasHeight;
        this.blocked = false;

        // Physics properties
        this.velocityY = 0;
        this.gravity = 0.5;
        this.onGround = false;
        this.blockedTime = 0; // in seconds
        this.jumpForce = -12; // negative value for upward velocity
        this.rotation = 0;

        this.image = new Image();
        this.image.src = 'Banner Walk Cycle/TMC_WC_0000.png';

        this.walkFrames = [];
        for (let i = 0; i <= 7; i++) {
            const img = new Image();
            img.src = `Banner Walk Cycle/TMC_WC_000${i}.png`;
            this.walkFrames.push(img);
        }
        this.frameIndex = 0;
        this.tickCount = 0;
        this.fps = 8; // Manually set animation FPS
    }

    update(obstacles, platforms) {
        // 1. HORIZONTAL MOVEMENT & COLLISION (with movable obstacles)
        this.blocked = false;
        this.rotation = 0; // Reset rotation each frame
        const nextX = this.x + this.baseSpeed;
        // Expand height slightly to ensure we detect the surface even when hovering (due to -12 offset)
        const horizontalPredictionRect = { x: nextX, y: this.y, w: this.w, h: this.h + 14 };
        let onSlope = false;

        for (const obs of obstacles) {
            if (checkCollision(horizontalPredictionRect, obs)) {
                const type = obs.getType();
                if (type === 'square') {
                    // Only block if we are hitting the side (not walking on top)
                    if (this.y + this.h > obs.y + 10) {
                        this.blocked = true;
                    }
                } else {
                    // Skip slope logic if we are jumping (moving up)
                    if (this.velocityY < 0) continue;

                    // Slope logic
                    // Simplified tracing logic:
                    // Just track the center point of the character against the shape's surface
                    const centerX = this.x + this.w / 2;
                    let surfaceY = obs.getSurfaceY(centerX);

                    // If center is slightly off but AABB collides, clamp to edges to keep tracing
                    if (surfaceY === null) {
                        if (centerX < obs.x) surfaceY = obs.getSurfaceY(obs.x);
                        else if (centerX > obs.x + obs.w) surfaceY = obs.getSurfaceY(obs.x + obs.w);
                    }

                    if (surfaceY !== null) {
                        // Calculate slope angle for light tilting
                        const delta = 5;
                        let yPrev = obs.getSurfaceY(centerX - delta);
                        let yNext = obs.getSurfaceY(centerX + delta);
                        if (yPrev === null) yPrev = surfaceY;
                        if (yNext === null) yNext = surfaceY;

                        // Check if the surface is flat to apply conditional lift
                        const isFlat = Math.abs(yNext - yPrev) < 0.1;
                        const lift = isFlat ? 0 : 10; // Add a 10px lift only on slopes

                        this.y = surfaceY - this.h - lift; // Apply lift
                        this.velocityY = 0;
                        this.onGround = true;
                        onSlope = true;

                        // Apply very light tilt (0.2 factor)
                        this.rotation = Math.atan2(yNext - yPrev, delta * 2) * 0.2;
                    }
                }
            }
        }

        if (this.blocked) {
            // Assuming 60fps, each frame is approx 1/60s.
            this.blockedTime += 1 / 60;
        } else {
            let currentSpeed = this.baseSpeed;
            if (onSlope) {
                // Move slightly slower on slopes to feel more natural
                currentSpeed *= 0.3;
            }
            this.x += currentSpeed; //keep moving
            this.blockedTime = 0; // Reset if not blocked
        }

        // Auto-jump if blocked for too long while on the ground
        if (this.blockedTime > 0.5 && this.onGround) {
            this.velocityY = this.jumpForce;
            this.onGround = false;
            this.blockedTime = 0; // Reset after jumping to prevent continuous jumps
        }

        // Wrap around screen horizontally
        if (this.x > this.canvasWidth) {
            this.x = -this.w;
            this.y = this.canvasHeight / 2 - this.h / 2;
            this.velocityY = 0;
        }

        // 2. VERTICAL MOVEMENT & COLLISION (with platforms/floor)
        if (!onSlope) {
            const prevY = this.y;
            this.velocityY += this.gravity;
            this.y += this.velocityY;
            this.onGround = false;

            const allSurfaces = [...platforms, ...obstacles];
            for (const surface of allSurfaces) {
                // Check for landing collision
                if (this.velocityY > 0 && (this.x + this.w > surface.x && this.x < surface.x + surface.w) && (prevY + this.h <= surface.y) && (this.y + this.h >= surface.y)) {
                    if (surface instanceof Obstacle && surface.getType() !== 'square') {
                        // For slopes, we need a more precise check to see if we're landing on the surface itself.
                        const footX = this.x + this.w / 2;
                        const surfaceY = surface.getSurfaceY(footX);
                        // Check if our feet are actually crossing the slope's surface line
                        if (surfaceY !== null && this.y + this.h >= surfaceY) {
                            // Calculate slope angle for light tilting on landing
                            const delta = 5;
                            let yPrev = surface.getSurfaceY(footX - delta);
                            let yNext = surface.getSurfaceY(footX + delta);
                            if (yPrev === null) yPrev = surfaceY;
                            if (yNext === null) yNext = surfaceY;

                            // Check if the surface is flat to apply conditional lift
                            const isFlat = Math.abs(yNext - yPrev) < 0.1;
                            const lift = isFlat ? 0 : 10; // Add a 10px lift only on slopes

                            this.y = surfaceY - this.h - lift; // Snap to surface with lift
                            this.velocityY = 0;
                            this.onGround = true;
                            this.rotation = Math.atan2(yNext - yPrev, delta * 2) * 0.2;

                            break;
                        }
                        // If not, we're in the "air" of the bounding box, so we continue to the next surface.
                    } else {
                        // For platforms and square obstacles, a simple bounding box collision is enough.
                        this.y = surface.y - this.h; 
                        this.velocityY = 0;
                        this.onGround = true;
                        break; 
                    }
                }
            }
        }

        // Simple Animation Cycle
        if (!this.blocked && this.onGround) {
            this.tickCount++;
            if (this.tickCount > (60 / this.fps)) { // Adjust speed based on target FPS
                this.tickCount = 0;
                this.frameIndex = (this.frameIndex + 1) % this.walkFrames.length;
                this.image = this.walkFrames[this.frameIndex];
            }
        } else {
            this.image = this.walkFrames[0]; // Idle frame
        }
    }

    draw(ctx) {
        ctx.save();
        const centerX = this.x + this.w / 2;
        const centerY = this.y + this.h / 2;
        ctx.translate(centerX, centerY);
        ctx.rotate(this.rotation);

        // Draw the image centered on the new (rotated) origin
        ctx.drawImage(this.image, -this.w / 2, -this.h / 2, this.w, this.h);
        
        ctx.restore();
    }
}

/**
 * Module: World
 * Main Game Controller
 */
class World {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        
        this.background = new Image();
        this.background.src = 'Background.png';
        
        this.character = new Character(this.canvas.width, this.canvas.height);
        
        // Movable objects
        this.obstacles = [];
        this.addObstacle(300, 260, 80, 80, 'square.png'); // Default square
        this.addObstacle(500, 280, 80, 60, 'triangle.png'); // Default triangle
        this.addObstacle(650, 290, 100, 50, 'trapezium.png', { slopePercent: 0.35 }); // Trapezium with a gentler slope

        // Static map elements (platforms)
        this.platforms = [];
        this.addPlatform(0, 340, 800, 60); // Main floor
        this.addPlatform(200, 250, 150, 20);
        this.addPlatform(450, 180, 200, 20);
        
        // Input State
        this.dragTarget = null;

        this.initInput();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    addObstacle(x, y, w, h, imageSrc, options) {
        this.obstacles.push(new Obstacle(x, y, w, h, imageSrc, options));


    }

    addPlatform(x, y, w, h) {
        this.platforms.push(new Platform(x, y, w, h));
    }

    // Handle Mouse Events
    initInput() {
        // Helper to get coordinates relative to the canvas, and scale them for responsiveness
        const getCanvasCoordinates = (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const scaleX = this.canvas.width / rect.width;
            const scaleY = this.canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            return {
                x: canvasX,
                y: canvasY
            };
        };

        const onDragStart = (e) => {
            if (e.type === 'touchstart') e.preventDefault();
            const { x, y } = getCanvasCoordinates(e);
            
            // Check if we clicked an obstacle (iterate backwards to grab top-most)
            for (let i = this.obstacles.length - 1; i >= 0; i--) {
                const obs = this.obstacles[i];
                if (obs.contains(x, y)) {
                    this.dragTarget = obs;
                    obs.isDragging = true;
                    obs.dragOffsetX = x - obs.x;
                    obs.dragOffsetY = y - obs.y;
                    return;
                }
            }
        };

        const onDragMove = (e) => {
            if (e.type === 'touchmove') e.preventDefault();
            if (this.dragTarget) {
                const { x, y } = getCanvasCoordinates(e);
                this.dragTarget.x = x - this.dragTarget.dragOffsetX;
                this.dragTarget.y = y - this.dragTarget.dragOffsetY;
            }
        };

        const onDragEnd = () => {
            if (this.dragTarget) {
                this.dragTarget.isDragging = false;
                this.dragTarget = null;
            }
        };

        this.canvas.addEventListener('mousedown', onDragStart);
        this.canvas.addEventListener('touchstart', onDragStart, { passive: false });
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('touchmove', onDragMove, { passive: false });
        window.addEventListener('mouseup', onDragEnd);
        window.addEventListener('touchend', onDragEnd);
    }

    update() {
        this.character.update(this.obstacles, this.platforms);
    }

    draw() {
        // Clear screen
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw background
        this.ctx.drawImage(this.background, 0, 0, this.canvas.width, this.canvas.height);

        // Draw the character first, so it appears behind the platforms and obstacles.
        this.character.draw(this.ctx);

        // Draw Platforms (map)
        this.platforms.forEach(p => p.draw(this.ctx));

        this.obstacles.forEach(obs => obs.draw(this.ctx));
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

// Start the project
const app = new World('gameCanvas');

</script>
</body>
</html>
